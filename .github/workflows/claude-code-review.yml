name: Claude Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to review'
        required: true
        type: number

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: 'true'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.inputs.pr_number }}

            Review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Type safety (mypy compliance)
            - Security concerns (hardcoded secrets, PII in scraped data)
            - Test coverage

            Use CLAUDE.md for project conventions.
            Post your complete review as a PR comment:
              gh pr comment ${{ github.event.inputs.pr_number }} --body "YOUR REVIEW HERE"
          claude_args: '--allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(cat:*),Bash(head:*)"'
