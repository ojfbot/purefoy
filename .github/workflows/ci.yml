name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: pip install ruff mypy types-python-dateutil types-requests types-beautifulsoup4

      - name: ruff check
        run: ruff check deakins_forums/ --select E,F,I,N,UP --ignore E501

      - name: ruff format check
        run: ruff format deakins_forums/ --check

      - name: mypy
        run: mypy deakins_forums/ --config-file pyproject.toml

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short -q

  ts-typecheck:
    name: TypeScript type-check & tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Type-check
        run: pnpm type-check

      - name: Test (API)
        run: pnpm --filter @purefoy/api test -- --run

  codegen-guard:
    name: Codegen schema drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: |
          pip install pydantic
          pnpm install

      - name: Regenerate schema
        run: pnpm codegen

      - name: Fail if schema has uncommitted changes
        run: |
          git diff --exit-code openapi.json packages/shared/src/generated/schema.ts \
            || (echo "Schema drift detected — run 'pnpm codegen' and commit the result" && exit 1)
