# Vercel deployment for tde.jim.software — standalone Flask UI.
#
# Python app — no build step required; Vercel serverless runtime handles it.
# READ_ONLY=1 is set on the Vercel project directly (not via this workflow).
#
# GitHub secrets required (already set via setup-vercel-ci):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

name: Deploy TDE to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'flask_app.py'
      - 'templates/**'
      - 'static/**'
      - 'library/**'
      - 'vercel.json'
      - 'requirements-vercel.txt'
      - '.github/workflows/deploy-tde.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flask_app.py'
      - 'templates/**'
      - 'static/**'
      - 'vercel.json'
      - 'requirements-vercel.txt'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: ${{ github.ref == 'refs/heads/main' && 'Production → tde.jim.software' || 'Preview Deploy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Resolve deploy flags
        id: flags
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "vercel_env=production" >> $GITHUB_OUTPUT
            echo "prod=--prod"           >> $GITHUB_OUTPUT
          else
            echo "vercel_env=preview"   >> $GITHUB_OUTPUT
            echo "prod="                >> $GITHUB_OUTPUT
          fi

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ steps.flags.outputs.vercel_env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy ${{ steps.flags.outputs.prod }} --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**TDE preview ready**\n🔍 ${{ steps.deploy.outputs.url }}`
            })
