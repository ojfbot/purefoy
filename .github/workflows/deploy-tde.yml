# Vercel deployment for tde.jim.software — standalone Flask UI.
# Deploys from a minimal staging directory to avoid bundling the full repo.
# READ_ONLY=1 is set in vercel.json env block (not a secret).
# DATA_CDN_URL is set on the Vercel project (production env var) — see ADR-010.
#
# Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (= ojf-purefoy-tde)

name: Deploy TDE (Flask) to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'flask_app.py'
      - 'templates/**'
      - 'static/**'
      - 'vercel.json'
      - 'requirements-vercel.txt'
      - '.github/workflows/deploy-tde.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flask_app.py'
      - 'templates/**'
      - 'static/**'
      - 'vercel.json'
      - 'requirements-vercel.txt'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: ${{ github.ref == 'refs/heads/main' && 'Production → tde.jim.software' || 'Preview → Flask TDE' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Resolve deploy flags
        id: flags
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "prod=--prod" >> $GITHUB_OUTPUT
          else
            echo "prod="      >> $GITHUB_OUTPUT
          fi

      - name: Stage Flask deploy files
        run: |
          mkdir -p /tmp/tde-stage
          cp flask_app.py requirements-vercel.txt vercel.json /tmp/tde-stage/
          cp -r templates/ static/ /tmp/tde-stage/
          # requirements.txt is what @vercel/python (uv runtime) picks up
          cp requirements-vercel.txt /tmp/tde-stage/requirements.txt

      - name: Deploy
        id: deploy
        working-directory: /tmp/tde-stage
        run: echo "url=$(vercel deploy ${{ steps.flags.outputs.prod }} --yes --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**TDE Flask preview ready**\n🔍 ${{ steps.deploy.outputs.url }}`
            })
